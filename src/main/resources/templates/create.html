<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Создать пост</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="container">
    <h1 style="color: green">Создать новый пост</h1>
    <hr/>
    <div class="row">
        <div class="col-md-12">
            <form method="post">
                <div class="form-group">
                    <textarea name="text" class="form-control" cols="30" rows="7" placeholder="Введите текст поста"></textarea>
                </div>
                <div class="form-group">
                    <input type="submit" class="btn btn-primary" value="Добавить новый пост">
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
